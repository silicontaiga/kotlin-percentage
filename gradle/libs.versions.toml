# Single source of truth for every dependency and plugin version.
# Renovate groups updates from this file into one PR per family; patch updates auto-merge on green CI.

[versions]
kotlin = "2.4.20"
kotest = "6.2.4"
# Drives a real kotlinc over source snippets, so the API's "this must not compile"
# guarantees are tested rather than assumed. Test-only; never on the consumer classpath.
kotlin-compile-testing = "0.13.0"
kover = "0.9.9"
binary-compatibility-validator = "0.18.1"
ktlint-gradle = "14.2.0"
# The ktlint engine itself, pinned independently of the Gradle plugin that drives it.
ktlint = "1.8.0"
detekt = "1.23.8"
dokka = "2.2.0"
maven-publish = "0.37.0"

[libraries]
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlin-compile-testing = { module = "dev.zacsweers.kctfork:core", version.ref = "kotlin-compile-testing" }
# Pinned to this project's own Kotlin version: the negative compilation tests must be judged
# by the same compiler that builds the library, not the older one kctfork happens to depend on.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
