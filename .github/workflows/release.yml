name: Release

# Tag-driven: pushing an annotated vX.Y.Z tag on main is the only manual step of a
# release; everything after it is machine work.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        # v1.2.3 -> 1.2.3
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish to Maven Central
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/wrapper-validation@v6.3.0

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Nothing is published that has not passed the same gate as every PR.
      - name: ./gradlew check
        run: ./gradlew check -PVERSION_NAME=${{ needs.version.outputs.version }}

      # Signed, uploaded to the Central Portal, and released automatically once
      # Central's validation passes (mavenPublishing { publishToMavenCentral(automaticRelease = true) }).
      - name: Publish
        run: ./gradlew publishToMavenCentral -PVERSION_NAME=${{ needs.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}

  docs:
    name: publish API docs
    needs: [version, publish]
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      pages: write
      id-token: write

  github-release:
    name: create GitHub release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      # Notes are GitHub's own, generated from the titles of the merged PRs.
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
