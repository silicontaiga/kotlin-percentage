name: Docs

# Called by release.yml; also runnable by hand to republish a version's docs.
# This repository's Pages source is "GitHub Actions", which deploys a whole site at
# once — so the accumulated, versioned site is kept on the `gh-pages` branch and
# redeployed in full each time, with this release's docs added to it.
on:
  workflow_call:
    inputs:
      version:
        description: Version to publish docs for, without the leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish docs for, without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-docs:
    name: publish Dokka to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the site to the gh-pages storage branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Generate API documentation
        run: ./gradlew dokkaGeneratePublicationHtml -PVERSION_NAME=${{ inputs.version }}

      - name: Add this version to the site
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Materialise the site branch, creating it empty on the first release.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages:gh-pages
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git branch gh-pages "$(git commit-tree "$empty_tree" -m 'docs: initialise site')"
          fi
          git worktree add site gh-pages

          rm -rf "site/${VERSION}" site/latest
          mkdir -p "site/${VERSION}" site/latest
          cp -R build/dokka/html/. "site/${VERSION}/"
          cp -R build/dokka/html/. site/latest/

          # Land on the newest docs from the site root; keep Pages' Jekyll away
          # from Dokka's underscore-prefixed asset directories.
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=./latest/">\n' > site/index.html
          touch site/.nojekyll

          git -C site add -A
          git -C site commit -m "docs: ${VERSION}" || echo 'site unchanged'
          git -C site push origin gh-pages

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5.0.1
